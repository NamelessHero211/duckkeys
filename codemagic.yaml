workflows:
  duckkeys-testflight:
    name: Duck Keys iOS — TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: DuckKeysAppStoreConnect
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.namelesshero.duckkeys
      vars:
        IOS_SOURCE_DIR: DuckKeys-iOS
        XCODE_PROJECT: DuckKeys.xcodeproj
        XCODE_SCHEME: DuckKeys
        APP_STORE_APPLE_ID: "6829620182"
    scripts:
      - name: Unpack iOS Xcode source
        script: unzip -q DuckKeys-iOS-Xcode.zip -d "$CM_BUILD_DIR"
      - name: Increment build number
        script: |
          cd "$CM_BUILD_DIR/$IOS_SOURCE_DIR"
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          case "$LATEST_BUILD_NUMBER" in
            ''|*[!0-9]*) LATEST_BUILD_NUMBER=0 ;;
          esac
          agvtool new-version -all "$((LATEST_BUILD_NUMBER + 1))"
      - name: Apply App Store signing profiles
        script: |
          cd "$CM_BUILD_DIR/$IOS_SOURCE_DIR"
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          cd "$CM_BUILD_DIR/$IOS_SOURCE_DIR"
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$IOS_SOURCE_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - DuckKeys-iOS/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false