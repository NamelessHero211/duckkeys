workflows:
  duckkeys-testflight:
    name: Duck Keys iOS — TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: DuckKeysAppStoreConnect
    environment:
      xcode: latest
      cocoapods: default
      groups:
        - duckkeys-signing
      vars:
        IOS_SOURCE_DIR: DuckKeys-iOS
        XCODE_PROJECT: DuckKeys.xcodeproj
        XCODE_SCHEME: DuckKeys
        APP_STORE_APPLE_ID: "6829620182"
    scripts:
      - name: Unpack iOS Xcode source
        script: unzip -oq DuckKeys-iOS-Xcode.zip -d "$CM_BUILD_DIR"
      - name: Repair Xcode project syntax
        script: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          project = Path(os.environ["CM_BUILD_DIR"]) / "DuckKeys-iOS" / "DuckKeys.xcodeproj" / "project.pbxproj"
          config_ids = (
              "500000000000000000000021",
              "500000000000000000000022",
              "500000000000000000000031",
              "500000000000000000000032",
          )
          lines = project.read_text().splitlines()
          for index, line in enumerate(lines):
              if any(line.lstrip().startswith(config_id + " ") for config_id in config_ids):
                  if line.rstrip().endswith("}"):
                      lines[index] = line + ";"
          project.write_text("\n".join(lines) + "\n")
          PY
      - name: Increment build number
        script: |
          cd "$CM_BUILD_DIR/$IOS_SOURCE_DIR"
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          case "$LATEST_BUILD_NUMBER" in
            ''|*[!0-9]*) LATEST_BUILD_NUMBER=0 ;;
          esac
          agvtool new-version -all "$((LATEST_BUILD_NUMBER + 1))"
      - name: Initialize signing keychain
        script: keychain initialize
      - name: Fetch app and keyboard extension signing profiles
        script: |
          app-store-connect fetch-signing-files com.namelesshero.duckkeys \
            --type IOS_APP_STORE --create
          app-store-connect fetch-signing-files com.namelesshero.duckkeys.keyboard \
            --type IOS_APP_STORE --create
      - name: Install signing certificate
        script: keychain add-certificates
      - name: Apply profiles to Xcode project
        script: |
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/$IOS_SOURCE_DIR/$XCODE_PROJECT"
      - name: Build signed IPA
        script: |
          cd "$CM_BUILD_DIR/$IOS_SOURCE_DIR"
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$IOS_SOURCE_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - DuckKeys-iOS/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
